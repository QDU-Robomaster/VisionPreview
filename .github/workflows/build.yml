name: Module CI
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  build:
    uses: xrobot-org/XRobot/.github/workflows/module-ci.yml@v1
    with:
      template-args: '[]'
      image: 'ghcr.io/xrobot-org/docker-image-webots:main'
      cmake-options: '-DWEBOTS_HOME=/usr/local/webots'
      ctest-regex: '^vision_preview_'
